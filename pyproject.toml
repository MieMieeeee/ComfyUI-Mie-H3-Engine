[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mie-h3-engine"
description = "Mie's fork of the MiniMax H3 Context Loop — the H3 long-video generation engine for the short-drama platform: recursive, checkpointed MiniMax H3 scene loops plus native-first AV target masking for inpainting, motion/audio continuity, audiovisual review, resume, and final assembly for ComfyUI."
version = "0.7.3+mie.1"
license = "GPL-3.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The authoring layer - the asset library, the script contract and the
    # plan assembler - lives in the craft package, on top of the prompt and
    # llm packages. They have to be installed into ComfyUI's own python,
    # not just the system one.
    "comfyui-mie-llm>=0.1.0",
    "comfyui-mie-prompt>=0.1.0",
    "comfyui-mie-craft>=0.1.0",
]
authors = [
    { name = "NikoDemon80", email = "262659861+NikoDemon80@users.noreply.github.com" },
    { name = "Ethanfel", email = "28683423+ethanfel@users.noreply.github.com" },
    { name = "MieMieeeee", email = "MieMieeeee@users.noreply.github.com" },
]
keywords = [
    "comfyui",
    "minimax-h3",
    "video-generation",
    "audio",
    "loop",
    "checkpoint",
    "resume",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/MieMieeeee/ComfyUI-Mie-H3-Engine"
Repository = "https://github.com/MieMieeeee/ComfyUI-Mie-H3-Engine"
Issues = "https://github.com/MieMieeeee/ComfyUI-Mie-H3-Engine/issues"
UpstreamProject = "https://github.com/ethanfel/ComfyUI-MiniMaxH3-Context-Loop"
Upstream = "https://github.com/NikoDemon80/ComfyUI-H3-Motion-Context"
MotionContextProvider = "https://github.com/seitanism/ComfyUI-H3-Motion-Context-MultiRef"

[tool.comfy]
PublisherId = "mie"
DisplayName = "Mie H3 Context Loop"

[tool.setuptools]
packages = []
