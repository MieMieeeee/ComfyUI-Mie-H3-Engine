{% extends "base.html" %}
{% block title %}角色与场景资产 · ComfyUI-Mie{% endblock %}

{% block content %}
<section class="panel" x-data="assetsPage()">
  <div class="panel-head">
    <h2>🎨 角色与场景资产</h2>
    <div class="panel-head-actions">
      <details class="path-detail">
        <summary class="muted small">资产库位置</summary>
        <code class="muted small" x-text="libraryDir"></code>
      </details>
      <button class="btn" type="button" @click="load()">🔄 刷新</button>
      <button class="btn primary" type="button" @click="startNew()">＋ 新建</button>
    </div>
  </div>

  <div class="split">
    <!-- 左：列表 -->
    <div class="split-list">
      <div class="filter-bar">
        <button class="pill" :class="{ active: kind === 'character' }"
                @click="setKind('character')">角色</button>
        <button class="pill" :class="{ active: kind === 'scene' }"
                @click="setKind('scene')">场景</button>
      </div>
      <div class="list-scroll">
        <template x-for="item in items" :key="item.name">
          <button class="list-row stack" :class="{ active: item.name === selected }"
                  @click="open(item.name)">
            <span class="row-main">
              <span x-text="item.name"></span>
              <span class="badge err" x-show="item.error" :title="item.error">损坏</span>
            </span>
            <span class="muted small" x-show="!item.error"
                  x-text="kind === 'character'
                    ? (item.image_count + '图 / ' + item.audio_count + '音')
                    : (item.image_count + '图')"></span>
            <span class="muted small" x-show="item.error" x-text="item.error"></span>
          </button>
        </template>
        <p class="muted" x-show="!items.length">这一类还没有资产。</p>
      </div>
    </div>

    <!-- 右：详情 -->
    <div class="split-detail">
      <div class="card" x-show="!editing">
        <div class="card-head">
          <h3 x-text="detail.name || '（未选中）'"></h3>
          <div class="panel-head-actions">
            <button class="btn" type="button" @click="startEdit()">✏️ 编辑</button>
            <button class="btn danger" type="button" @click="remove()">🗑️ 删除</button>
          </div>
        </div>
        <!-- 全部图片的缩略图（U03）：点开放大，不再只给第一张。 -->
        <div class="preview-row" x-show="(detail.images || []).length">
          <template x-for="(img, i) in detail.images || []" :key="i">
            <button class="thumb" type="button" @click="lightbox = img"
                    :aria-label="'放大第 ' + (i + 1) + ' 张图'">
              <img class="preview-img" :src="img" :alt="'第 ' + (i + 1) + ' 张图'">
            </button>
          </template>
        </div>
        <p class="muted" x-show="!(detail.images || []).length">没有图片。</p>

        <!-- 声音样本（U01）：全部可放，标序号和时长；没样本就明说。 -->
        <div class="sample-list" x-show="kind === 'character'">
          <span class="small"><strong>声音样本</strong>
            <span class="muted" x-show="(detail.audios || []).length"
                  x-text="'（' + detail.audios.length + ' 段；引擎按序号顺序使用）'"></span>
          </span>
          <template x-for="clip in detail.audios || []" :key="clip.url">
            <div class="sample-row">
              <button class="btn" type="button"
                      @click="playSample('a:' + clip.url, clip.url)"
                      :aria-label="'播放样本 ' + clip.index"
                      x-text="audioPreviewState.key === 'a:' + clip.url && audioPreviewState.playing
                        ? '⏸ 暂停' : '▶ 播放'"></button>
              <span class="small" x-text="'样本 ' + clip.index"></span>
              <span class="muted small"
                    x-text="audioPreviewState.key === 'a:' + clip.url
                      ? fmtSeconds(audioPreviewState.position) + ' / ' + fmtSeconds(audioPreviewState.duration)
                      : (clip.ext || '').toUpperCase()"></span>
              <input class="sample-seek" type="range" min="0" step="0.1"
                     :max="audioPreviewState.duration || 0"
                     :value="audioPreviewState.key === 'a:' + clip.url ? audioPreviewState.position : 0"
                     @input="seekSample($event)"
                     :disabled="audioPreviewState.key !== 'a:' + clip.url || !audioPreviewState.duration"
                     :aria-label="'样本 ' + clip.index + ' 进度'">
              <button class="btn" type="button" @click="replaySample()"
                      :disabled="audioPreviewState.key !== 'a:' + clip.url"
                      aria-label="重播">↺</button>
            </div>
          </template>
          <p class="muted small" x-show="!(detail.audios || []).length">
            暂无声音样本——只有文字描述没法确认实际声音。
            <button class="btn" type="button" @click="startEdit()">去上传声音样本</button>
          </p>
        </div>

        <dl class="meta-list">
          <dt>描述</dt><dd x-text="detail.description || '（空）'"></dd>
          <template x-if="kind === 'character'">
            <dt>音色</dt>
          </template>
          <dd x-show="kind === 'character'" x-text="detail.voice || '（空）'"></dd>
          <template x-if="kind === 'scene'">
            <dt>环境音</dt>
          </template>
          <dd x-show="kind === 'scene'" x-text="detail.ambience || '（空）'"></dd>
        </dl>
      </div>

      <div class="card" x-show="editing">
        <div class="card-head">
          <h3 x-text="form.name || '新建'"></h3>
          <div class="panel-head-actions">
            <button class="btn primary" type="button" @click="save()">💾 保存</button>
            <button class="btn" type="button" @click="cancel()">取消</button>
          </div>
        </div>
        <label class="field">
          <span>名字</span>
          <input class="input" x-model="form.name" placeholder="角色或场景的名字">
        </label>
        <label class="field">
          <span>描述</span>
          <textarea class="input" rows="3" x-model="form.description"></textarea>
        </label>
        <label class="field" x-show="kind === 'character'">
          <span>音色描述</span>
          <input class="input" x-model="form.voice" placeholder="例如：young female, soft timbre">
        </label>
        <label class="field" x-show="kind === 'scene'">
          <span>环境音（英文）</span>
          <input class="input" x-model="form.ambience" placeholder="例如：Quiet room tone">
        </label>
        <!-- 媒体的必填/保留规则按新建与编辑分开说（U03），
             选了文件就有新旧对照、本地试听和撤销。 -->
        <label class="field">
          <span x-text="selected
            ? (kind === 'character' ? '立绘（不选则保留现有图片）' : '场景图（不选则保留现有图片）')
            : (kind === 'character' ? '立绘（新建必填）' : '场景图（新建必填）')"></span>
          <input class="input" type="file" accept="image/*" @change="pickImage($event)">
        </label>
        <div class="media-compare" x-show="imageObjectUrl || detail.image">
          <figure x-show="detail.image && imageObjectUrl">
            <img class="preview-img" :src="detail.image" alt="现有图片">
            <figcaption class="muted small">现有</figcaption>
          </figure>
          <figure x-show="imageObjectUrl">
            <img class="preview-img" :src="imageObjectUrl" alt="新选的图片">
            <figcaption class="muted small">将保存为新图</figcaption>
          </figure>
          <button class="btn" type="button" x-show="imageObjectUrl"
                  @click="undoImagePick()">撤销本次选择</button>
        </div>
        <label class="field" x-show="kind === 'character'">
          <span x-text="selected
            ? '音色样本（不选则保留现有样本；选了会替换全部）'
            : '音色样本（新建必填）'"></span>
          <input class="input" type="file" accept="audio/*" @change="pickAudio($event)">
        </label>
        <div class="media-compare" x-show="audioObjectUrl">
          <p class="small" style="margin: 0">
            将替换 <span x-text="detail.audio_count || 0"></span> 段现有样本。
            先听一下确认没选错：
          </p>
          <div class="sample-row">
            <button class="btn" type="button"
                    @click="playSample('local-audio', audioObjectUrl)"
                    x-text="audioPreviewState.key === 'local-audio' && audioPreviewState.playing
                      ? '⏸ 暂停' : '▶ 试听新样本'"></button>
            <span class="muted small" x-text="audioPreviewState.key === 'local-audio'
              ? fmtSeconds(audioPreviewState.position) + ' / ' + fmtSeconds(audioPreviewState.duration) : ''"></span>
            <button class="btn" type="button" @click="undoAudioPick()">撤销本次选择</button>
          </div>
        </div>

        <!-- AI 补全：对标 auto 保存节点，只起草空字段 -->
        <div class="auto-box">
          <input class="input" x-model="autoHint"
                 placeholder="一句提示（可选）：告诉 AI 这个人/地方的关键点">
          <button class="btn" type="button" :disabled="autoBusy"
                  @click="autoFill()"
                  x-text="autoBusy ? '补全中…' : '✨ AI 补全'"></button>
        </div>
        <p class="muted small">
          只补空字段（描述 / <span x-show="kind === 'character'">音色</span><span x-show="kind === 'scene'">环境音</span>）；
          传了图就看图写描述。想重新起草就先清空对应字段。
        </p>
      </div>
    </div>
  </div>

  <!-- 回执在两张卡片之外：编辑卡片保存后会被藏起来（editing=false），
       回执放里面就等于永远看不见。 -->
  <div class="result-box" x-show="message" x-text="message"></div>

  <!-- 放大查看（U03）：点缩略图打开，Esc/点空白处关闭。 -->
  <div class="lightbox" x-show="lightbox" @click="lightbox = ''"
       @keydown.escape.window="lightbox = ''" role="dialog" aria-label="放大查看图片">
    <img :src="lightbox" alt="放大查看">
  </div>
</section>
{% endblock %}
