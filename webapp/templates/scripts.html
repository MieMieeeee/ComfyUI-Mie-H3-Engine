{% extends "base.html" %}
{% block title %}剧本资产 · ComfyUI-Mie{% endblock %}

{% block content %}
<section class="panel" x-data="scriptsPage()">
  <div class="panel-head">
    <h2>📜 剧本资产</h2>
    <div class="panel-head-actions">
      <button class="btn" type="button" @click="load()">🔄 刷新</button>
      <button class="btn" type="button" @click="startDraft('concept')">✨ AI 起草</button>
      <button class="btn primary" type="button" @click="startNew()">＋ 新建</button>
    </div>
  </div>

  <p class="muted">
    <code>source_script</code> 是人写的源，每个事件一行
    （台词 <code>角色1：你好</code> ／ 动作 <code>角色1动作：…</code> ／
    入场 <code>角色1入场：…</code> ／ 离场 <code>角色1离场：…</code>），
    分镜由事件分段生成，契约校验在编辑时自动运行。
  </p>

  <div class="split">
    <!-- 左：列表。窄屏收成选择入口（U08），列表本身不占首屏。 -->
    <label class="field narrow-picker">
      <span class="muted small">剧本（<span x-text="items.length"></span>）</span>
      <select class="input" @change="open($event.target.value); $event.target.value = ''">
        <option value="">选择剧本…</option>
        <template x-for="item in items" :key="item.name">
          <option :value="item.name" x-text="item.name"></option>
        </template>
      </select>
    </label>
    <div class="split-list">
      <div class="list-scroll">
        <template x-for="item in items" :key="item.name">
          <button class="list-row stack" :class="{ active: item.name === selected }"
                  @click="open(item.name)">
            <span class="row-main">
              <span class="cell-strong" x-text="item.name"></span>
              <span class="badge err" x-show="item.error" :title="item.error">损坏</span>
            </span>
            <span class="muted small" x-text="metaLine(item)"></span>
          </button>
        </template>
        <p class="muted" x-show="!items.length">还没有剧本资产。</p>
      </div>
    </div>

    <!-- 右：工作台 -->
    <div class="split-detail">
      <!-- 这份剧本读不出来的时候，得说清楚为什么读不出来：不然这里
           只有一句"从左侧选择一个剧本"，像是没点中。
           读不出来的剧本也得能删——不然它就永远留在库里，点不掉。 -->
      <div class="validation-box" x-show="loadError">
        <p x-text="loadError" style="margin: 0 0 8px;"></p>
        <button class="btn danger" type="button" @click="remove()"
                x-show="selected">🗑️ 删掉这份剧本</button>
      </div>
      <p class="muted" x-show="!model && !draftOpen && !intakeOpen && !loadError">从左侧选择一个剧本，或点「＋ 新建」「✨ AI 起草」。</p>

      <!-- 上次没写完的起草会话：问一句，等用户决定 -->
      <template x-if="intakeResume">
        <div class="card">
          <div class="card-head">
            <h3>🕘 有一份没写完的起草</h3>
            <div class="panel-head-actions">
              <button class="btn primary" type="button"
                      @click="intakeResumeFromStash()">继续草稿</button>
              <button class="btn" type="button"
                      @click="intakeDropStash()">清空草稿</button>
            </div>
          </div>
          <p class="muted small" style="margin: 0"
             x-text="'暂存于 ' + new Date(intakeResume.updated_at || 0).toLocaleString()
                     + '；文字：' + (intakeResume.text || '（无文字）').slice(0, 60)
                     + (intakeResume.reading ? '；已有一份图片理解' : '')"></p>
        </div>
      </template>

      <!-- AI 修订表单（以当前剧本为底稿；起草走下面那张 intake 卡片） -->
      <template x-if="draftOpen">
        <div class="card">
          <div class="card-head">
            <h3>✨ 修订当前剧本</h3>
          </div>

          <label class="field">
            <span>修改要求（写这一版要改什么，未提及的部分保持不变）</span>
            <textarea class="input" rows="4" x-model="draftForm.concept"
                      placeholder="例如：结尾改成她笑而不语，其余不动。"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span>名字</span>
              <input class="input" x-model="draftForm.name">
            </label>
          </div>

          <div class="auto-actions">
            <button class="btn primary" type="button" :disabled="drafting"
                    @click="runDraft()"
                    x-text="drafting ? '生成中…（可能要一两分钟）' : '✨ 生成修订'"></button>
            <button class="btn" type="button" :disabled="drafting"
                    @click="draftOpen = false">取消</button>
          </div>
        </div>
      </template>

      <!-- 从图片或文字起草（intake 计划的主入口） -->
      <template x-if="intakeOpen">
        <div class="card intake-card">
          <div class="card-head">
            <h3>✨ 从图片或文字起草</h3>
            <div class="panel-head-actions">
              <!-- U07：当前用的是谁、能不能看图，起草前就说清 -->
              <span class="muted small" x-show="intake.modelInfo && intake.modelInfo.configured"
                    :title="'当前平台 ' + intake.modelInfo.key"
                    x-text="'模型：' + intake.modelInfo.name
                      + (intake.modelInfo.model ? ' · ' + intake.modelInfo.model : '')"></span>
              <span class="muted small" x-show="intake.reading && intake.reading.vision"
                    x-text="intake.reading.vision === 'supported' ? '（已能看图）'
                      : intake.reading.vision === 'unsupported' ? '（此平台看不了图，可补图注）' : ''"></span>
              <span class="badge warn" x-show="!intake.modelInfo">未配置大模型</span>
              <a class="btn" x-show="!intake.modelInfo" href="/llm"
                 title="去大模型页选平台配 Key；素材在起草卡里等你">⚙️ 去设置</a>
              <button class="btn subtle" type="button" x-show="intake.modelInfo"
                      @click="intakeRefreshModelInfo()" title="重读当前平台">🔄</button>
              <span class="badge" x-text="intakeStepLabel"></span>
              <button class="btn" type="button"
                      :disabled="intake.readBusy || intake.genBusy"
                      @click="closeIntake()">收起</button>
            </div>
          </div>
          <p class="muted small" style="margin: 0 0 8px" x-show="intake.modelInfo && !intake.modelInfo.configured">
            当前平台（<span x-text="intake.modelInfo.name"></span>）还没配 Key：
            <a href="/llm">去大模型页配置</a>，素材都还在。
          </p>

          <!-- 素材：文字 + 可选图片。reading 忙碌时原样保留。 -->
          <div class="intake-material"
               x-show="intake.step === 'material' || intake.step === 'reading'">
            <!-- 返回素材时上一份事件稿还在（F05）；重新开始是唯一清空的路 -->
            <div class="intake-keepdraft" x-show="intake.eventDraft">
              <p class="small" style="margin: 0">
                上一份事件稿还在（<span x-text="intakeVisibleEvents.length"></span>
                条，含你的改动）：再整理会给出新旧两份的选择。
              </p>
              <button class="btn" type="button"
                      @click="intakeRestartEvents()">🗑 重新开始（清空事件稿）</button>
            </div>
            <label class="field">
              <span>文字（一段点子、一个故事或几句台词草稿都行）</span>
              <textarea class="input" rows="4" x-model="intake.text"
                        @input="intakeTextPolicyHint()"
                        placeholder="例如：外卖员发现客人养的猫会自己开门，两人成了朋友。"></textarea>
            </label>

            <div class="intake-policy">
              <span class="small"><strong>生成方式</strong></span>
              <div class="filter-bar">
                <button class="pill" type="button"
                        :class="{ active: intake.flowMode === 'direct' }"
                        @click="intake.flowMode = 'direct'; intakeTouch()">直接出一版</button>
                <button class="pill" type="button"
                        :class="{ active: intake.flowMode === 'guided' }"
                        @click="intake.flowMode = 'guided'; intakeTouch()">一起设计</button>
              </div>
              <p class="muted small" style="margin: 2px 0 0"
                 x-text="intake.flowMode === 'direct'
                   ? '一次生成完整草稿，检查后再改。'
                   : '先整理角色和事件，逐条确认后按确认稿生成。'"></p>
            </div>

            <div class="intake-policy">
              <span class="small"><strong>文字规则</strong></span>
              <div class="filter-bar">
                <button class="pill" type="button"
                        :class="{ active: intake.textPolicy === 'adapt' }"
                        @click="intake.textPolicy = 'adapt'; intake.policyChosen = true; intakeTouch()">允许改编</button>
                <button class="pill" type="button"
                        :class="{ active: intake.textPolicy === 'keep' }"
                        @click="intake.textPolicy = 'keep'; intake.policyChosen = true; intakeTouch()">保留原台词</button>
              </div>
              <p class="muted small" style="margin: 2px 0 0"
                 x-text="intake.textPolicy === 'adapt'
                   ? 'AI 可调整情节和台词。'
                   : '已确认的事件逐字进入成片剧本：模型只分镜和配执行描述，不改你的字。'"></p>
              <p class="muted small" x-show="intake.policyChosen === false && intake.textPolicy === 'keep'">
                已识别 <span x-text="intake.policyHintLines || 0"></span> 行角色事件，预选了「保留原台词」；不合适就换。
              </p>
            </div>

            <div class="intake-image">
              <template x-if="!intake.image">
                <label class="btn intake-pick">
                  ＋ 放一张图（可选）
                  <input type="file" accept="image/jpeg,image/png,image/webp"
                         class="sr-file" @change="intakePickImage($event)">
                </label>
              </template>
              <template x-if="intake.image">
                <div class="intake-preview">
                  <img :src="intake.imageDataUrl" alt="已选的素材图片">
                  <div class="intake-preview-meta">
                    <p class="small" x-text="intake.image.name"></p>
                    <div class="job-actions">
                      <label class="btn">
                        替换
                        <input type="file" accept="image/jpeg,image/png,image/webp"
                               class="sr-file" @change="intakePickImage($event)">
                      </label>
                      <button class="btn" type="button"
                              @click="intakeRemoveImage()">删除</button>
                    </div>
                  </div>
                </div>
              </template>
              <p class="muted small">图片用于理解故事。视频参考图可在后续单独设置。</p>
              <p class="err small" x-show="intake.imageError"
                 x-text="intake.imageError"></p>
              <p class="muted small" x-show="intake.imageBusy">正在处理图片…</p>

              <!-- 另存为参考资产：显式、独立于剧本保存（M3） -->
              <div class="intake-asset" x-show="intake.image">
                <button class="btn" type="button" x-show="!intake.assetForm"
                        @click="intakeOpenAssetForm()">另存为参考资产</button>
                <template x-if="intake.assetForm && !intake.assetForm.saved">
                  <div class="intake-asset-form">
                    <p class="small" style="margin: 0 0 6px">
                      把这张图存进资产库（角色立绘或场景参考）。这是独立动作：
                      存不存不影响眼前的草稿，剧本要另行保存。
                    </p>
                    <div class="field-row">
                      <label class="field">
                        <span>类型</span>
                        <select class="input" x-model="intake.assetForm.kind">
                          <option value="character">角色</option>
                          <option value="scene">场景</option>
                        </select>
                      </label>
                      <label class="field">
                        <span>名称</span>
                        <input class="input" x-model="intake.assetForm.name">
                      </label>
                    </div>
                    <label class="field">
                      <span>参考目标（图里有几个人物时写清这图当谁的参考；全图即目标可写“全图”）</span>
                      <input class="input" x-model="intake.assetForm.target"
                             placeholder="例如：蓝外套年轻人（左一）">
                    </label>
                    <!-- 多人物图的区域裁剪（F07）：保存的图本身就是所选人物 -->
                    <div class="crop-block">
                      <div class="job-actions">
                        <button class="btn" type="button" x-show="!intake.assetForm.cropOpen"
                                @click="intakeOpenCrop()">✂️ 裁剪区域（多人物图）</button>
                        <button class="btn" type="button" x-show="intake.assetForm.cropOpen"
                                @click="intake.assetForm.cropOpen = false">不裁了，沿用全图</button>
                      </div>
                      <canvas class="crop-canvas" x-show="intake.assetForm.cropOpen"
                              aria-label="拖动选择要保存的区域"></canvas>
                      <p class="muted small" x-show="intake.assetForm.cropOpen">
                        在图上按住拖一个框，松开后点「用这个区域」。
                      </p>
                      <div class="job-actions" x-show="intake.assetForm.cropOpen">
                        <button class="btn primary" type="button"
                                @click="intakeApplyCrop()">用这个区域</button>
                      </div>
                      <figure class="media-compare" x-show="intake.assetForm.croppedUrl">
                        <img class="preview-img" :src="intake.assetForm.croppedUrl" alt="裁剪后的区域">
                        <figcaption class="muted small">将保存这个区域</figcaption>
                        <button class="btn" type="button" @click="intakeUndoCrop()">撤销裁剪（用全图）</button>
                      </figure>
                    </div>
                    <label class="field" x-show="intake.assetForm.kind === 'character'">
                      <span>声音说明（角色必填）</span>
                      <input class="input" x-model="intake.assetForm.voice"
                             placeholder="例如：低沉男声">
                    </label>
                    <label class="field">
                      <span>描述</span>
                      <textarea class="input" rows="2"
                                x-model="intake.assetForm.description"></textarea>
                    </label>
                    <p class="err small" x-show="intake.assetForm.error"
                       x-text="intake.assetForm.error"></p>
                    <!-- 同名资产（F06）：先看现有的是什么，改名或明确覆盖 -->
                    <div class="intake-exists" x-show="intake.assetForm.exists">
                      <p class="small" style="margin: 0 0 6px">
                        ⚠ 已经有同名
                        <span x-text="intake.assetForm.kind === 'scene' ? '场景' : '角色'"></span>
                        「<span x-text="(intake.assetForm.exists || {}).name || intake.assetForm.name"></span>」：
                        改个名字另存一份，或者明确覆盖它（现有描述和图会被替换）。
                      </p>
                      <div class="media-compare" x-show="(intake.assetForm.exists || {}).image">
                        <img class="preview-img" :src="(intake.assetForm.exists || {}).image" alt="现有资产图">
                        <span class="muted small"
                              x-text="((intake.assetForm.exists || {}).description || '').slice(0, 60)"></span>
                      </div>
                      <div class="job-actions">
                        <button class="btn" type="button"
                                @click="intake.assetForm.exists = null">我改名字</button>
                        <button class="btn danger" type="button"
                                :disabled="intake.assetForm.busy"
                                @click="intakeSaveAsset(true)">覆盖它</button>
                      </div>
                    </div>
                    <div class="job-actions" x-show="!intake.assetForm.exists">
                      <button class="btn primary" type="button"
                              :disabled="intake.assetForm.busy"
                              @click="intakeSaveAsset()"
                              x-text="intake.assetForm.busy ? '保存中…' : '存入资产库'"></button>
                      <button class="btn" type="button"
                              :disabled="intake.assetForm.drafting"
                              @click="intakeDraftAssetFields()"
                              x-text="intake.assetForm.drafting ? 'AI 补全中…' : '✨ AI 补全描述'"></button>
                      <button class="btn" type="button"
                              :disabled="intake.assetForm.busy"
                              @click="intake.assetForm = null">取消</button>
                    </div>
                  </div>
                </template>
                <template x-if="intake.assetForm && intake.assetForm.saved">
                  <div class="intake-asset-done">
                    <p class="small" style="margin: 0 0 4px">
                      ✅ 已入库：<span x-text="intake.assetForm.saved.kind"></span>
                      「<span x-text="intake.assetForm.saved.name"></span>」。
                      到 <a :href="'/assets'">资产页</a> 可以查看和继续编辑，
                      去制作页绑定使用。
                    </p>
                    <!-- 读回确认（F07）：说“存了”不算，读回来对上才算 -->
                    <p class="muted small" x-show="intake.assetForm.saved.target"
                       style="margin: 0 0 4px"
                       :class="intake.assetForm.saved.targetOk ? '' : 'err'"
                       x-text="intake.assetForm.saved.targetOk
                         ? '参考目标已随描述一起入库（读回核对过）：' + intake.assetForm.saved.target
                         : '⚠ 读回核对没找到参考目标：到资产页检查描述。'"></p>
                    <p class="muted small" style="margin: 0">
                      资产入库 ≠ 制作引用：渲染时在制作页按角色显式绑定它。
                    </p>
                    <div class="job-actions">
                      <a class="btn" :href="'/assets?kind=' + intake.assetForm.kind
                        + '&asset=' + encodeURIComponent(intake.assetForm.saved.name)"
                        target="_blank" rel="noopener">在资产页查看</a>
                      <button class="btn" type="button"
                              @click="intake.assetForm = null">好的</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- 平台看不了图时的降级：作者的话就是图的内容 -->
            <div class="intake-caption" x-show="intake.needsCaption || intake.hasCaption">
              <label class="field">
                <span>图注（这个平台看不了图；用你的话写图里有什么，生成按图注理解）</span>
                <textarea class="input" rows="2" x-model="intake.caption"
                          @input="intakeCaptionInput()"
                          placeholder="例如：傍晚的厨房，一个穿蓝外套的年轻人蹲着逗一只橘猫。"></textarea>
              </label>
              <p class="muted small" x-show="intake.reading && intake.reading.basis === 'caption'">
                当前理解根据你提供的图注（人工来源）。
              </p>
            </div>
          </div>

          <p class="muted small" x-show="intake.step === 'reading'">
            正在理解素材…（可以取消等待；取消后服务器的调用可能已经产生费用）
          </p>

          <!-- 理解确认：改过即确认。candidate 生成期间也保持可见。 -->
          <template x-if="intake.reading && ['understanding', 'generating', 'candidate'].includes(intake.step)">
            <div class="intake-reading">
              <h4 class="editor-sub">图片理解（检查并修改；改过的就是你的确认稿）</h4>
              <p class="muted small" x-show="intake.reading.basis === 'caption'">
                当前理解根据你提供的图注（人工来源）。
              </p>

              <div class="intake-group">
                <span class="small"><strong>图中可见</strong>（只描述看得到的事实）</span>
                <template x-for="(item, index) in intake.reading.observed" :key="item.id">
                  <div class="intake-item">
                    <textarea class="input" rows="1" x-model="item.text"
                              @change="intakeTouch()"
                              :aria-label="'图中可见 第' + (index + 1) + '条'"></textarea>
                    <button class="btn" type="button"
                            @click="intakeRemoveItem('observed', item.id)"
                            :aria-label="'删除图中可见 第' + (index + 1) + '条'">删</button>
                  </div>
                </template>
                <button class="btn" type="button" @click="intakeAddItem('observed')">＋ 加一条</button>
              </div>

              <div class="intake-group">
                <span class="small"><strong>创作建议</strong>（模型的猜想，可改可删）</span>
                <template x-for="(item, index) in intake.reading.proposed" :key="item.id">
                  <div class="intake-item">
                    <textarea class="input" rows="1" x-model="item.text"
                              @change="intakeTouch()"
                              :aria-label="'创作建议 第' + (index + 1) + '条'"></textarea>
                    <button class="btn" type="button"
                            @click="intakeRemoveItem('proposed', item.id)"
                            :aria-label="'删除创作建议 第' + (index + 1) + '条'">删</button>
                  </div>
                </template>
                <button class="btn" type="button" @click="intakeAddItem('proposed')">＋ 加一条</button>
              </div>

              <div class="intake-group" x-show="intake.reading.conflicts.length">
                <span class="small"><strong>图文冲突</strong>（每条都要处理，才能生成）</span>
                <template x-for="conflict in intake.reading.conflicts" :key="conflict.id">
                  <div class="intake-conflict">
                    <p class="small" style="margin: 4px 0">
                      <strong x-text="conflict.field || '未命名'"></strong>
                      —— 图：<span x-text="conflict.image"></span>
                       ／ 文：<span x-text="conflict.text"></span>
                    </p>
                    <div class="filter-bar">
                      <button class="pill" type="button"
                              :class="{ active: conflict.resolution === 'text' }"
                              @click="intakeResolveConflict(conflict, 'text')">以文字为准</button>
                      <button class="pill" type="button"
                              :class="{ active: conflict.resolution === 'image' }"
                              @click="intakeResolveConflict(conflict, 'image')">以图片为准</button>
                      <button class="pill" type="button"
                              :class="{ active: conflict.resolution === 'manual' }"
                              @click="intakeResolveConflict(conflict, 'manual')">手动改写</button>
                    </div>
                    <textarea class="input" rows="1" x-model="conflict.override"
                              x-show="conflict.resolution === 'manual'"
                              @change="intakeTouch()"
                              placeholder="写下按哪个说法来讲这个故事"></textarea>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- 事件稿：角色卡 + 事件行 + 未分配片段 + 整体设计 + 预检 -->
          <template x-if="intake.step === 'events' && intake.eventDraft">
            <div class="intake-events">
              <!-- 重新整理后：上一份（带作者改动）与新建议之间的明确选择（F05） -->
              <div class="intake-draft-choice" x-show="intake.showDraftChoice">
                <p class="small" style="margin: 0 0 6px">
                  这是按当前素材重新整理的<b>新建议</b>。你上一份改过的稿子（角色、台词、
                  顺序和补写采用状态）完整保留着，可以一键换回：
                </p>
                <div class="job-actions">
                  <button class="btn primary" type="button"
                          @click="intakeUsePreviousDraft()">沿用上一份（含我的改动）</button>
                  <button class="btn" type="button"
                          @click="intakeKeepNewDraft()">就用这份新建议</button>
                </div>
              </div>
              <p class="muted small" x-show="intake.eventDraft.mode === 'parsed'">
                原文已经是角色事件行：直接按共享解析器读入，没有经过模型改写。
              </p>
              <p class="muted small" x-show="intake.eventDraft.mode === 'proposed'">
                这是模型的整理建议：逐条核对，补写的台词（标着「补写」）默认不参与，
                勾选才算确认。
              </p>

              <!-- 角色 -->
              <div class="intake-group">
                <span class="small"><strong>角色</strong>（改名会同步到所有事件；删角色前先处理它的事件）</span>
                <template x-for="(role, index) in intake.eventDraft.roles" :key="role.ui_id">
                  <div class="intake-role">
                    <input class="input intake-role-name" x-model="role.name"
                           @change="intakeTouchEvents()"
                           :aria-label="'角色 ' + (index + 1) + ' 名字'">
                    <select class="input" x-model="role.presence"
                            @change="if (role.presence === 'off_screen') { role.initially_visible = false; role.position = 'none'; } else { role.initially_visible = true; } intakeTouchEvents()"
                            :aria-label="'角色 ' + (index + 1) + ' 画面内外'">
                      <option value="on_screen">画面内</option>
                      <option value="off_screen">画外</option>
                    </select>
                    <select class="input" x-model="role.position"
                            x-show="role.presence === 'on_screen'"
                            @change="intakeTouchEvents()"
                            :aria-label="'角色 ' + (index + 1) + ' 位置'">
                      <option value="left">左侧</option>
                      <option value="center">中间</option>
                      <option value="right">右侧</option>
                    </select>
                    <input class="input intake-role-voice" x-model="role.voice"
                           @change="intakeTouchEvents()"
                           placeholder="声音说明（可选）"
                           :aria-label="'角色 ' + (index + 1) + ' 声音'">
                    <button class="btn" type="button"
                            @click="intakeRemoveRole(index)"
                            :aria-label="'删除角色 ' + (index + 1)">删</button>
                  </div>
                </template>
                <button class="btn" type="button" @click="intakeAddRole()">＋ 加一个角色</button>
              </div>

              <!-- 事件行 -->
              <div class="intake-group">
                <span class="small">
                  <strong>事件</strong>
                  <span class="muted" x-text="'（' + intakeVisibleEvents.length + ' 条；按发生顺序，生成时逐字锁定）'"></span>
                </span>
                <template x-for="(event, index) in intakeVisibleEvents" :key="event.ui_id">
                  <div class="intake-event">
                    <span class="intake-event-no" x-text="index + 1"></span>
                    <select class="input intake-event-role"
                            @change="intakeSetEvent(event, 'role', Number($event.target.value)); intakeTouchEvents()"
                            :aria-label="'事件 ' + (index + 1) + ' 角色'">
                      <!-- 选项由内部 x-for 生成：select 的 value 在选项就绪
                           前设置会被浏览器丢弃（F02），所以选中态写在每个
                           option 上，渲染完成即正确。 -->
                      <template x-for="(role, rIndex) in intake.eventDraft.roles" :key="role.ui_id">
                        <option :value="rIndex" :selected="rIndex === event.role"
                                x-text="(rIndex + 1) + '·' + (role.name || '未命名')"></option>
                      </template>
                    </select>
                    <select class="input intake-event-type" x-model="event.type"
                            @change="intakeTouchEvents()"
                            :aria-label="'事件 ' + (index + 1) + ' 类型'">
                      <option value="dialogue">台词</option>
                      <option value="action">动作</option>
                      <option value="enter">入场</option>
                      <option value="exit">离场</option>
                    </select>
                    <textarea class="input intake-event-text" rows="1" x-model="event.text"
                              @change="intakeTouchEvents()"
                              :class="{ 'input-err': intakeEventError(index) }"
                              :aria-label="'事件 ' + (index + 1) + ' 内容'"></textarea>
                    <select class="input intake-event-lang" x-model="event.language"
                            @change="intakeTouchEvents()"
                            :aria-label="'事件 ' + (index + 1) + ' 语言'">
                      <option value="zh">zh</option>
                      <option value="en">en</option>
                    </select>
                    <div class="intake-event-tools">
                      <button class="btn" type="button" title="上移" :disabled="index === 0"
                              @click="intakeMoveEvent(index, -1)"
                              :aria-label="'事件 ' + (index + 1) + ' 上移'">↑</button>
                      <button class="btn" type="button" title="下移"
                              :disabled="index === intakeVisibleEvents.length - 1"
                              @click="intakeMoveEvent(index, 1)"
                              :aria-label="'事件 ' + (index + 1) + ' 下移'">↓</button>
                      <button class="btn" type="button" title="复制"
                              @click="intakeDuplicateEvent(index)"
                              :aria-label="'复制事件 ' + (index + 1)">⧉</button>
                      <button class="btn" type="button" title="删除"
                              @click="intakeRemoveEvent(index)"
                              :aria-label="'删除事件 ' + (index + 1)">删</button>
                    </div>
                    <label class="inline-check intake-addition-check"
                           x-show="event.addition">
                      <input type="checkbox" :checked="event.included"
                             @change="intakeToggleAddition(event)">
                      补写，确认采用
                    </label>
                    <p class="err small intake-event-error"
                       x-show="intakeEventError(index)"
                       x-text="intakeEventError(index)"></p>
                  </div>
                </template>
                <button class="btn" type="button" @click="intakeAddEvent()">＋ 加一条事件</button>
              </div>

              <!-- 未分配的原文片段：保留台词路径的关口 -->
              <div class="intake-group" x-show="intake.eventDraft.unmapped.length">
                <span class="small"><strong>还没认领的原文片段</strong>（每条都要处理：加成事件、记为场景说明，或解除保留）</span>
                <template x-for="piece in intake.eventDraft.unmapped" :key="piece.ui_id">
                  <div class="intake-piece" :class="{ handled: piece.handled }">
                    <p class="small" style="margin: 0" x-text="piece.text"></p>
                    <div class="job-actions" x-show="!piece.handled">
                      <button class="btn" type="button"
                              @click="intakeAssignPiece(piece)">加成一条事件</button>
                      <button class="btn" type="button"
                              @click="intakePieceToScene(piece)">记为场景说明</button>
                      <button class="btn" type="button"
                              @click="intakeDropPiece(piece)">解除保留</button>
                    </div>
                    <p class="muted small" style="margin: 0" x-show="piece.handled"
                       x-text="piece.handledHow === 'event' ? '已加成事件'
                         : piece.handledHow === 'scene' ? '已记入场景说明'
                         : '已解除保留（不进剧本）'"></p>
                  </div>
                </template>
              </div>

              <!-- 整体设计（全局画面参数；script 模式会锁定它们） -->
              <details class="intake-design">
                <summary class="small"><strong>整体设计</strong>（场景与世界观的说明；这些是全剧本的全局设置）</summary>
                <label class="field">
                  <span>场景描述（scene：这幕发生在哪，画面里看得见的环境）</span>
                  <textarea class="input" rows="2" x-model="intake.design.scene"
                            @change="intakeTouchEvents()"></textarea>
                </label>
                <div class="field-row">
                  <label class="field">
                    <span>世界观（setting）</span>
                    <input class="input" x-model="intake.design.setting" @change="intakeTouchEvents()">
                  </label>
                  <label class="field">
                    <span>画面风格（look）</span>
                    <input class="input" x-model="intake.design.look" @change="intakeTouchEvents()">
                  </label>
                </div>
                <label class="field">
                  <span>导演要求（constraints）</span>
                  <input class="input" x-model="intake.design.constraints" @change="intakeTouchEvents()">
                </label>
                <div class="field-row">
                  <label class="field">
                    <span>默认景别</span>
                    <select class="input" x-model="intake.design.camera.framing" @change="intakeTouchEvents()">
                      <option value="medium_shot">中景</option>
                      <option value="medium_close_up">中近景</option>
                      <option value="close_up">近景</option>
                      <option value="wide_shot">全景</option>
                    </select>
                  </label>
                  <label class="field">
                    <span>默认运动</span>
                    <select class="input" x-model="intake.design.camera.movement" @change="intakeTouchEvents()">
                      <option value="locked">固定</option>
                      <option value="slow_zoom_in">缓推</option>
                      <option value="slow_zoom_out">缓拉</option>
                    </select>
                  </label>
                  <label class="field">
                    <span>默认视角</span>
                    <select class="input" x-model="intake.design.camera.perspective" @change="intakeTouchEvents()">
                      <option value="observer">旁观</option>
                      <option value="first_person">第一人称</option>
                    </select>
                  </label>
                </div>
              </details>

              <!-- 预检结果（生成参数沿用下方表单） -->
              <div class="intake-precheck">
                <div class="job-actions">
                  <button class="btn" type="button" @click="intakeValidate()">重新预检</button>
                  <span class="badge" x-show="intake.validateState.checked"
                        :class="intake.validateState.ok ? 'ok' : 'err'"
                        x-text="intake.validateState.ok ? '预检通过' : '预检有问题'"></span>
                </div>
                <template x-if="intake.validateState.checked">
                  <div>
                    <p class="err small" x-show="intake.validateState.errors.length"
                       x-text="intakeHeaderErrors.map((e) => e.message).join('；')"></p>
                    <p class="muted small" x-show="!intake.validateState.errors.length">
                      事件 <span x-text="intakeVisibleEvents.length"></span> 条、
                      角色 <span x-text="intake.eventDraft.roles.length"></span> 个：
                      按确认内容生成时逐字锁定，模型只做分镜和执行描述。
                    </p>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- 生成参数：material 和 understanding 阶段可改 -->
          <div class="intake-form"
               x-show="intake.step === 'material' || intake.step === 'understanding' || intake.step === 'events'">
            <!-- 一句话故事摘要（U05）：生成前核对“这版在讲什么”。 -->
            <label class="field">
              <span>一句话故事摘要（引导路径会作为导演要求的一部分传给生成；已确认的事件不受影响）</span>
              <textarea class="input" rows="2" x-model="intake.storySummary"
                        @change="intakeTouch()"
                        placeholder="例如：两个陌生人在天台偶遇，互相说出了不敢说的话。"></textarea>
            </label>
            <div class="field-row">
              <label class="field">
                <span>名字</span>
                <input class="input" x-model="intake.form.name"
                       @change="intakeTouch()">
              </label>
              <label class="field">
                <span>段数（分镜数）</span>
                <!-- 0 是“自动”（模型按内容定）：不再把 0 显示成数字（U05），
                     两条生成路径都把选择原样传给服务端。 -->
                <select class="input" @change="intake.form.shot_count = Number($event.target.value); intakeTouch()"
                        :aria-label="'段数（分镜数），当前 ' + (intake.form.shot_count === 0 ? '自动' : intake.form.shot_count + ' 镜')">
                  <option value="0" :selected="intake.form.shot_count === 0">自动</option>
                  <template x-for="n in 20" :key="n">
                    <option :value="n" :selected="intake.form.shot_count === n"
                            x-text="n + ' 镜'"></option>
                  </template>
                </select>
              </label>
              <label class="field">
                <span>语言</span>
                <select class="input" x-model="intake.form.language" @change="intakeTouch()">
                  <option value="zh">中文 zh</option>
                  <option value="en">English en</option>
                </select>
              </label>
              <label class="field">
                <span>目标时长（秒）</span>
                <input class="input" type="number" min="1" max="600" step="0.1"
                       x-model.number="intake.form.target_duration_seconds"
                       @change="intakeTouch()">
              </label>
              <label class="field">
                <span>配音模式</span>
                <select class="input" x-model="intake.form.audio_mode" @change="intakeTouch()">
                  <option value="generated">生成 generated</option>
                  <option value="reference">参考 reference</option>
                </select>
              </label>
            </div>
            <label class="inline-check">
              <input type="checkbox" x-model="intake.form.critic" @change="intakeTouch()">
              生成后让 LLM 复核连续性（多一次调用）
            </label>
          </div>

          <p class="err" x-show="intake.readError" x-text="intake.readError"></p>
          <p class="err" x-show="intake.genError" x-text="intake.genError"></p>
          <p class="muted small" x-show="intake.stashFailed">
            ⚠ 本次内容尚未暂存（浏览器存储不可用）：页面别关，刷新会丢。
          </p>
          <p class="muted small" x-show="intake.step === 'generating'">
            正在生成分镜草稿…已等待 <span x-text="intake.waited"></span> 秒。
            可以取消等待；取消后服务器的调用可能已经产生费用。
          </p>

          <!-- 候选结果：先看清楚，再决定要不要盖进编辑器 -->
          <template x-if="intake.step === 'candidate' && intake.candidate">
            <div class="intake-candidate">
              <h4 class="editor-sub">草稿已生成 <span class="badge warn">待保存</span></h4>
              <p class="small muted" style="margin: 4px 0"
                 x-text="'共 ' + (intake.candidate.json.shots || []).length + ' 镜；载入编辑器检查后按「💾 保存」入库。'"></p>
              <p class="small" x-show="(intake.candidate.notes || []).length"
                 x-text="'备注：' + intake.candidate.notes.join('；')"></p>
              <p class="muted small"
                 x-show="isDirty || intake.candidate.revision !== intake.revision">
                编辑器里有未保存的改动，或生成之后素材又改过：载入会以这份草稿为准。
              </p>
            </div>
          </template>

          <!-- 生成前的确认摘要（U05）：说清这次生成实际按什么条件走 -->
          <p class="muted small" style="margin: 4px 0 0"
             x-show="['material', 'understanding', 'events'].includes(intake.step)
                     && (intake.text.trim() || intake.reading || intake.image)"
             x-text="intakePrefaceSummary"></p>

          <div class="auto-actions">
            <button class="btn primary" type="button"
                    :disabled="intakePrimary.disabled"
                    @click="intakePrimary.run()"
                    x-text="intakePrimary.label"></button>
            <button class="btn" type="button" x-show="intakeSecondary"
                    @click="intakeSecondary && intakeSecondary.run()"
                    x-text="intakeSecondary ? intakeSecondary.label : ''"></button>
          </div>
        </div>
      </template>

      <template x-if="!draftOpen && model">
        <div class="card">
          <!-- script 路径的草稿：确认稿被改动时明说（§7） -->
          <p class="muted small" style="margin: 0 0 6px"
             x-show="intakeConfirmed && !confirmedEventsDrifted"
             x-text="'这份草稿按 ' + intakeConfirmed.count + ' 条已确认事件逐字生成；改事件前先想清楚。'"></p>
          <p class="err small" style="margin: 0 0 6px"
             x-show="confirmedEventsDrifted">
            ⚠ 事件被改过：这份稿子已经偏离当初确认的
            <span x-text="intakeConfirmed ? intakeConfirmed.count : 0"></span>
            条事件。保存时存的是现在这份（改过的），确认稿不再作数。
          </p>
          <div class="card-head">
            <h3 x-text="model.name || '（未命名）'"></h3>
            <div class="panel-head-actions">
              <span class="badge" :class="isDirty ? 'warn' : 'ok'"
                    x-text="savedLabel"></span>
              <span class="badge ok" x-show="selected && versionInfo.current"
                    :title="'这一份剧本现在到第 ' + versionInfo.current + ' 版'"
                    x-text="'版本 ' + versionInfo.current"></span>
              <button class="btn" type="button" @click="versionOpen = !versionOpen"
                      x-show="selected" title="这一份剧本的版本历史">🕘 版本</button>
              <a class="btn" x-show="selected && !isDirty" :href="'/video?script=' + encodeURIComponent(selected)"
                 title="带着这份剧本去制作页">🎬 用此剧本制作</a>
              <!-- U04：有未保存修改时，主动作变成“保存并制作”——
                   保存的明确版本才是制作输入，失败留在当前稿。 -->
              <button class="btn" type="button" x-show="selected && isDirty"
                      @click="saveAndMake()"
                      title="先保存这份修改（产生新版本），再带着它去制作页">💾 保存并制作</button>
              <button class="btn" type="button" @click="startDraft('revise')"
                      x-show="selected" title="以当前剧本为底稿，按修改意见生成下一版">✨ 修订</button>
              <button class="btn" type="button" @click="validateNow(true)">✔️ 校验</button>
              <button class="btn primary" type="button" @click="save()">💾 保存</button>
              <button class="btn danger" type="button" @click="remove()">🗑️ 删除</button>
            </div>
          </div>

          <!-- 版本历史：保存永远产生新的一版，旧的一版一直留着。 -->
          <div class="draft-box" x-show="versionOpen && selected">
            <strong>版本历史（<span x-text="versionInfo.items.length"></span> 版）</strong>
            <p class="muted small">
              当前版是引擎渲染用的那份。每次保存都会把上一版留在这里，
              旧版可以打开来看，也可以恢复成当前版（恢复会存成新的一版，历史只增不减）。
            </p>
            <ul class="version-list">
              <template x-for="v in versionInfo.items" :key="v.number">
                <li class="version-row">
                  <span class="cell-strong" x-text="'版本 ' + v.number"></span>
                  <span class="muted small" x-text="v.time"></span>
                  <span class="muted small" x-text="v.note"></span>
                  <span class="badge ok" x-show="v.current">当前</span>
                  <span class="auto-actions">
                    <button class="btn subtle" type="button" @click="openVersion(v.number)"
                            x-show="!v.current" title="把这一版读进编辑器看看（不落库）">打开</button>
                    <button class="btn subtle" type="button" @click="restoreVersion(v.number)"
                            x-show="!v.current" title="用这一版的内容存成新的一版">恢复</button>
                    <button class="btn subtle" type="button" @click="deleteVersion(v.number)"
                            x-show="!v.current" title="删掉这一版，救不回来">删掉</button>
                  </span>
                </li>
              </template>
            </ul>
          </div>

          <!-- 上次没保存就关掉的改动，还在本地。 -->
          <div class="draft-box" x-show="recoveredDraft">
            <strong>发现未保存的草稿</strong>
            <p class="muted small">
              上一次在这里改过东西但没保存。恢复它，还是丢掉、从库里那份重新开始？
            </p>
            <div class="auto-actions">
              <button class="btn primary" type="button" @click="restoreDraft()">↩ 恢复草稿</button>
              <button class="btn" type="button" @click="discardDraft()">丢弃草稿</button>
            </div>
          </div>

          <!-- 起草备注：LLM 评审意见，与契约渲染风险分开。 -->
          <div class="draft-box" x-show="draftNotes.length">
            <strong>起草备注（LLM 评审）</strong>
            <ul><template x-for="(n, i) in draftNotes" :key="i"><li x-text="n"></li></template></ul>
          </div>

          <!-- 校验回执：三个标签共用，切换标签不会弄丢。 -->
          <div class="validation-box" x-show="errors.length">
            <strong class="err">契约不通过</strong>
            <ul><template x-for="e in errors" :key="e"><li x-text="e"></li></template></ul>
          </div>
          <div class="validation-box risk" x-show="warnings.length">
            <div class="risk-summary">
              <strong class="warn">渲染风险</strong>
              <template x-for="chip in warningChips" :key="chip.label">
                <button class="warn-chip" type="button" :class="chip.level"
                        :title="parsedWarnings.filter((w) => w.label === chip.label).map((w) => w.text).join('\n')"
                        @click="warnOpen = !warnOpen"
                        x-text="chip.label + ' ×' + chip.count"></button>
              </template>
              <button class="btn primary" type="button" @click="fixAllWarnings()"
                      :disabled="fixing || drafting || !parsedWarnings.length"
                      :title="fixing ? '正在改：要判断的那几条要等模型写完' : '按每一条风险的建议，把这一版一次性改好'"
                      x-text="fixing ? '正在改…' : '✨ 全部按建议改'"></button>
              <button class="btn subtle" type="button" @click="warnOpen = !warnOpen"
                      x-text="warnOpen ? '收起' : '说明'"></button>
            </div>
            <ul x-show="warnOpen">
              <template x-for="(w, i) in parsedWarnings" :key="i">
                <li class="risk-row">
                  <span class="warn-chip mini" :class="w.level" x-text="w.label"></span>
                  <span class="muted small" x-show="w.shot" x-text="w.shot"></span>
                  <span class="risk-text" x-text="w.text"></span>
                  <button class="btn subtle" type="button" @click="fixWarning(w)"
                          :disabled="fixing || drafting"
                          :title="(w.kind === 'duration'
                            ? '按这条建议改：时长算得出来，直接改好，不用模型'
                            : '按这条建议改：交给模型重写一版草稿') + '&#10;' + w.fix">✨ 按这条改</button>
                </li>
              </template>
            </ul>
            <p class="muted small" x-show="warnOpen">
              每条风险后面都有「按这条改」，上面还有「全部按建议改」：能算出来的
              直接改时长（不用模型），要判断的合成一次交给模型重写一版草稿
              （要等它写完）。改动都停在编辑器里，你看过再存。
            </p>
          </div>
          <div class="validation-box ok" x-show="okMessage" x-text="okMessage"></div>

          <div class="workbench-tabs">
            <button class="pill" type="button" :class="{ active: tab === 'preview' }"
                    @click="setTab('preview')">👁 预览</button>
            <button class="pill" type="button" :class="{ active: tab === 'edit' }"
                    @click="setTab('edit')">✏️ 编辑</button>
            <button class="pill" type="button" :class="{ active: tab === 'json' }"
                    @click="setTab('json')">🧾 JSON 源码</button>
          </div>

          <!-- ============================== 预览 ============================== -->
          <div x-show="tab === 'preview'" class="preview-pane">
            <p class="muted" x-show="!board || !(board.shots || []).length">
              还没有通过契约的分镜。切到「编辑」把内容补齐，校验通过后这里会出现时间轴。
            </p>

            <template x-if="board && board.shots && board.shots.length">
              <div>
                <dl class="meta-list">
                  <dt>时长</dt>
                  <dd>
                    <span x-text="'目标 ' + formatSeconds(board.target_duration_seconds)
                      + ' → 预计交付 ' + formatSeconds(deliveredSeconds)"></span>
                    <span class="muted small"
                          x-text="'（' + board.shots.length + ' 段生成 · 重叠 '
                            + (board.continuation_overlap_frames ?? 22) + ' 帧）'"></span>
                  </dd>
                  <dt>相机</dt>
                  <dd x-text="board.camera.framing + ' · ' + board.camera.movement
                    + ' · ' + board.camera.perspective"></dd>
                  <dt>语言</dt>
                  <dd x-text="(board.language === 'en' ? 'English' : '中文') + ' · '
                    + (board.audio_mode === 'reference' ? '参考音色' : '生成音色')"></dd>
                  <template x-if="board.light">
                    <dt>光</dt>
                  </template>
                  <dd x-show="board.light"
                      x-text="board.light === 'custom' ? board.light_text : board.light"></dd>
                  <template x-if="board.look">
                    <dt>画风</dt>
                  </template>
                  <dd x-show="board.look" x-text="board.look"></dd>
                  <template x-if="board.constraints">
                    <dt>约束</dt>
                  </template>
                  <dd x-show="board.constraints" class="prewrap" x-text="board.constraints"></dd>
                </dl>

                <div class="timeline">
                  <template x-for="seg in timeline" :key="seg.id">
                    <button class="timeline-seg" type="button"
                            :style="'width:' + seg.width + '%'"
                            :title="seg.id + ' · ' + formatSeconds(seg.seconds)"
                            @click="scrollToShot(seg.id)">
                      <span x-text="seg.id"></span>
                      <span class="small" x-text="formatSeconds(seg.seconds)"></span>
                    </button>
                  </template>
                </div>

                <h4 class="editor-section">角色</h4>
                <div class="chip-row">
                  <template x-for="(role, index) in board.roles" :key="role.id">
                    <span class="role-chip" :class="{ offscreen: role.presence === 'off_screen' }">
                      <span x-text="'角色' + (index + 1) + '=' + role.name"></span>
                      <span class="muted small"
                            x-text="role.presence + (role.position && role.position !== 'none'
                              ? ' / ' + role.position : '')"></span>
                    </span>
                  </template>
                </div>

                <h4 class="editor-section">分镜</h4>
                <template x-for="shot in board.shots" :key="shot.id">
                  <div class="shot-card" :id="'shot-' + shot.id">
                    <div class="shot-head">
                      <span class="cell-strong" x-text="shot.id"></span>
                      <span class="muted small"
                            x-text="formatSeconds(shot.duration_seconds) + ' · '
                              + shot.events.length + ' 事件'"></span>
                      <span class="row-main">
                        <template x-for="w in warningsForShot(shot.id)" :key="w.text">
                          <span class="warn-chip" :class="w.level"
                                :title="w.text" x-text="w.label"></span>
                        </template>
                      </span>
                    </div>
                    <template x-for="event in shot.events" :key="event.id">
                      <div class="event-line">
                        <span class="badge" x-text="eventTypeName(event.type)"></span>
                        <span class="cell-strong" x-text="roleName(event.character)"></span>
                        <span x-text="event.text"></span>
                        <span class="muted small" x-show="event.language !== board.language"
                              x-text="'[' + event.language + ']'"></span>
                        <span class="event-risk err" x-show="riskyEvent(event)"
                              title="不含可发音字符：H3 会渲染成提示音而非沉默；停顿请改用动作事件，反应请给出台词">⚠ 提示音</span>
                      </div>
                    </template>
                    <template x-for="cut in shot.camera_cuts || []" :key="cut.before_event">
                      <div class="event-line muted small">
                        <span x-text="'✂ ' + cut.before_event + ' 起切 ' + cut.framing"></span>
                      </div>
                    </template>
                  </div>
                </template>

                <details class="preview-block" x-show="board.scene || board.setting">
                  <summary>场景与表演设定</summary>
                  <pre class="preview-text" x-text="(board.scene ? '场景：\n' + board.scene + '\n\n' : '')
                    + (board.setting ? '表演设定：\n' + board.setting : '')"></pre>
                </details>
                <details class="preview-block">
                  <summary>源文本全文</summary>
                  <pre class="preview-text" x-text="board.source_script"></pre>
                </details>
              </div>
            </template>
          </div>

          <!-- ============================== 编辑 ============================== -->
          <!-- @input/@change 都冒泡到这里：改任何字段都会重新解析并触发自动校验 -->
          <div x-show="tab === 'edit'" class="editor-pane"
               @change="afterModelChange()" @input="afterModelChange()">

            <h4 class="editor-section">基本信息</h4>
            <div class="field-row">
              <label class="field">
                <span>名字</span>
                <input class="input" x-model="model.name" placeholder="剧本名字">
              </label>
              <label class="field">
                <span>语言</span>
                <select class="input" x-model="model.language">
                  <option value="zh">中文 zh</option>
                  <option value="en">English en</option>
                </select>
              </label>
              <label class="field">
                <span>配音模式</span>
                <select class="input" x-model="model.audio_mode">
                  <option value="generated">生成 generated</option>
                  <option value="reference">参考 reference（≤3 角色）</option>
                </select>
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                <span>目标时长（秒）</span>
                <input class="input" type="number" step="0.1" min="1" max="600"
                       x-model.number="model.target_duration_seconds">
              </label>
              <label class="field">
                <span>重叠帧（0–120）</span>
                <input class="input" type="number" step="1" min="0" max="120"
                       x-model.number="model.continuation_overlap_frames">
              </label>
              <label class="field">
                <span>光锚 light</span>
                <select class="input" x-model="model.light">
                  <option value="follow_image">follow_image 跟随图像</option>
                  <option value="daylight">daylight 日光</option>
                  <option value="golden_hour">golden_hour 黄金时刻</option>
                  <option value="night_lamp">night_lamp 夜灯</option>
                  <option value="night_screen">night_screen 夜屏</option>
                  <option value="late_night">late_night 深夜</option>
                  <option value="morning">morning 清晨</option>
                  <option value="custom">custom 自定义</option>
                </select>
              </label>
            </div>
            <label class="field" x-show="model.light === 'custom'">
              <span>光锚描述 light_text（custom 必填）</span>
              <input class="input" x-model="model.light_text">
            </label>
            <p class="muted small" x-show="minimumBoardSeconds > 0"
               x-text="'按当前分镜，契约最少需要 ' + formatSeconds(minimumBoardSeconds)
                 + (Number(model.target_duration_seconds) < minimumBoardSeconds
                   ? ' — 目标时长偏短，校验会报 too short' : '')"></p>

            <h4 class="editor-section">相机 camera</h4>
            <div class="field-row">
              <label class="field">
                <span>景别 framing</span>
                <select class="input" x-model="model.camera.framing">
                  <option value="two_shot">two_shot 双人</option>
                  <option value="medium_shot">medium_shot 中景</option>
                  <option value="medium_close_up">medium_close_up 中近景</option>
                  <option value="close_up">close_up 特写</option>
                  <option value="wide_shot">wide_shot 远景</option>
                </select>
              </label>
              <label class="field">
                <span>运动 movement</span>
                <select class="input" x-model="model.camera.movement">
                  <option value="locked">locked 锁定</option>
                  <option value="gentle_follow">gentle_follow 缓跟</option>
                </select>
              </label>
              <label class="field">
                <span>视角 perspective</span>
                <select class="input" x-model="model.camera.perspective">
                  <option value="observer">observer 旁观</option>
                  <option value="first_person">first_person 第一人称</option>
                </select>
              </label>
            </div>

            <h4 class="editor-section">画面与舞台（源语言）</h4>
            <label class="field">
              <span>画风 look</span>
              <textarea class="input" rows="2" x-model="model.look"></textarea>
            </label>
            <label class="field">
              <span>表演设定 setting</span>
              <textarea class="input" rows="2" x-model="model.setting"></textarea>
            </label>
            <label class="field">
              <span>场景 scene（接线场景资产时会被覆盖）</span>
              <textarea class="input" rows="2" x-model="model.scene"></textarea>
            </label>
            <label class="field">
              <span>约束 constraints（人读契约，不进编译）</span>
              <textarea class="input" rows="2" x-model="model.constraints"></textarea>
            </label>

            <h4 class="editor-section">
              角色 <span class="muted small">（最多 8 位；id 按顺序自动编号）</span>
              <button class="btn subtle" type="button" @click="addRole()">＋ 添加角色</button>
            </h4>
            <template x-for="(role, index) in model.roles" :key="index">
              <div class="role-editor">
                <span class="chip" x-text="'角色' + (index + 1)"></span>
                <input class="input" placeholder="名字" x-model="role.name">
                <select class="input" x-model="role.presence" @change="onPresenceChange(role)">
                  <option value="on_screen">出镜</option>
                  <option value="off_screen">画外</option>
                </select>
                <label class="inline-check" x-show="role.presence === 'on_screen'">
                  <input type="checkbox" x-model="role.initially_visible"> 初始可见
                </label>
                <select class="input" x-model="role.position"
                        :disabled="role.presence === 'off_screen'">
                  <option value="left">左</option>
                  <option value="center">中</option>
                  <option value="right">右</option>
                  <option value="none">无</option>
                </select>
                <input class="input" placeholder="音色（英文短语，可空）" x-model="role.voice">
                <button class="btn subtle" type="button" title="删除该角色"
                        @click="removeRole(index)">✕</button>
              </div>
            </template>

            <h4 class="editor-section">
              源文本 source_script
              <span class="muted small">（事件的唯一编辑源；每行一个事件，# 开头是注释）</span>
            </h4>
            <textarea class="input code" rows="6" x-model="model.source_script"></textarea>
            <div class="validation-box" x-show="parseError">
              <span class="err" x-text="parseError"></span>
            </div>

            <h4 class="editor-section">
              分镜 <span class="muted small">（在事件处用 ✂ 分段；服务端校验后会重算每镜时长）</span>
            </h4>
            <template x-for="(shot, gi) in shotSummaries" :key="shot.id">
              <div class="shot-card">
                <div class="shot-head">
                  <span class="cell-strong" x-text="shot.id"></span>
                  <span class="muted small"
                        x-text="formatSeconds(shot.seconds) + ' · ' + shot.events.length + ' 事件'"></span>
                  <span class="row-main">
                    <template x-for="w in warningsForShot(shot.id)" :key="w.text">
                      <span class="warn-chip" :class="w.level"
                            :title="w.text" x-text="w.label"></span>
                    </template>
                  </span>
                  <span class="row-tools">
                    <button class="btn subtle" type="button" x-show="gi > 0"
                            @click="mergeUp(gi)">⤒ 合并到上一镜</button>
                  </span>
                </div>
                <template x-for="(event, ei) in shot.events" :key="event.id">
                  <div class="event-line">
                    <span class="badge" x-text="eventTypeName(event.type)"></span>
                    <span class="cell-strong" x-text="roleName(event.character)"></span>
                    <span x-text="event.text"></span>
                    <span class="muted small" x-show="event.language !== model.language"
                          x-text="'[' + event.language + ']'"></span>
                    <span class="event-risk err" x-show="riskyEvent(event)"
                          title="不含可发音字符：H3 会渲染成提示音而非沉默；停顿请改用动作事件，反应请给出台词">⚠ 提示音</span>
                    <button class="btn subtle event-split" type="button" x-show="ei > 0"
                            title="在此事件前分段"
                            @click="splitBefore(grouping[gi][ei])">✂</button>
                  </div>
                </template>
              </div>
            </template>

            <h4 class="editor-section">
              默认角色设计 <span class="muted small">（源语言；接入角色资产时覆盖，留空即不启用）</span>
            </h4>
            <template x-for="role in onScreenRoles" :key="role.id">
              <label class="field">
                <span x-text="role.name + '（' + role.id + '）'"></span>
                <textarea class="input" rows="2"
                          x-model="model.character_designs[role.id]"></textarea>
              </label>
            </template>

            <details class="preview-block advanced" x-show="model.execution">
              <summary>
                执行镜像 execution（高级）
                <span class="badge warn" x-show="executionStale">镜像未跟上</span>
              </summary>
              <div class="advanced-body">
            <p class="muted small">
              英文镜像是你写给编译器的：不会随中文设定自动更新，也不会被悄悄覆盖。
              <span class="warn small" x-show="executionStale" x-text="executionNote"></span>
              <button class="btn subtle" type="button" x-show="executionStale"
                      @click="confirmExecution()">我已确认</button>
              <button class="btn subtle" type="button" x-show="executionStale"
                      @click="draftExecution()" :disabled="draftingExecution"
                      title="只重写英文镜像，分镜、台词一个字都不动；改完先给你看差异">✨ 更新生成描述</button>
              <button class="btn subtle" type="button" x-show="executionStale"
                      @click="startDraft('revise')"
                      title="以当前剧本为底稿，让模型重写这一版（会带上你的修改要求）">✨ 让 AI 重写整版</button>
            </p>

            <!-- 模型重写的镜像：先看差异，用不用由作者定。 -->
            <div class="draft-box" x-show="executionDraft">
              <p class="muted small">
                新的英文镜像（还没进编辑器）：
                <button class="btn primary" type="button" @click="applyExecutionDraft()">用这一版</button>
                <button class="btn subtle" type="button" @click="discardExecutionDraft()">不用了</button>
              </p>
              <p class="muted small" x-show="executionDraft && !(executionDraft.diff || []).length">
                新旧内容一样，没有需要改的地方。
              </p>
              <template x-for="row in ((executionDraft && executionDraft.diff) || [])" :key="row.field">
                <div class="diff-row">
                  <div class="cell-strong small" x-text="row.field"></div>
                  <div class="diff-before small" x-text="row.before || '（空）'"></div>
                  <div class="diff-after small" x-text="row.after || '（空）'"></div>
                </div>
              </template>
            </div>

            <label class="field">
              <span>look</span>
              <textarea class="input" rows="2" x-model="model.execution.look"></textarea>
            </label>
            <label class="field">
              <span>setting</span>
              <textarea class="input" rows="2" x-model="model.execution.setting"></textarea>
            </label>
            <label class="field" x-show="model.scene && model.scene.trim()">
              <span>scene（英文镜像）</span>
              <textarea class="input" rows="2" x-model="model.execution.scene"></textarea>
            </label>
            <label class="field" x-show="model.light === 'custom'">
              <span>light（英文镜像）</span>
              <textarea class="input" rows="2" x-model="model.execution.light"></textarea>
            </label>
            <label class="field">
              <span>visible_state（英文，正向可视描述）</span>
              <textarea class="input" rows="2" x-model="model.execution.visible_state"></textarea>
            </label>

            <h5 class="editor-sub">voices（每个角色的英文音色镜像）</h5>
            <template x-for="role in model.roles" :key="role.id">
              <label class="field">
                <span x-text="role.name + '（' + role.id + '）'"></span>
                <input class="input" x-model="model.execution.voices[role.id]"
                       placeholder="英文音色短语；角色没写音色时留空">
              </label>
            </template>

            <h5 class="editor-sub">
              directions（每个动作/入场/离场事件的英文执导，以该角色的英文名开头，如 Character 1 …）
            </h5>
            <template x-for="event in directionEvents" :key="event.id">
              <label class="field">
                <span x-text="event.id + ' · ' + eventTypeName(event.type) + ' · '
                  + roleName(event.character) + '：' + event.text"></span>
                <input class="input" x-model="model.execution.directions[event.id]"
                       :placeholder="'Character ' + characterNumber(event.character) + ' …'">
              </label>
            </template>
            <p class="muted small" x-show="!directionEvents.length">没有动作类事件，directions 为空。</p>

            <template x-if="onScreenRoles.some((role) => model.character_designs[role.id])">
              <div>
                <h5 class="editor-sub">character_designs（英文镜像）</h5>
                <template x-for="role in onScreenRoles" :key="'ex-' + role.id">
                  <label class="field" x-show="model.character_designs[role.id]">
                    <span x-text="role.name + '（' + role.id + '）英文镜像'"></span>
                    <textarea class="input" rows="2"
                              x-model="model.execution.character_designs[role.id]"></textarea>
                  </label>
                </template>
              </div>
            </template>
              </div>
            </details>
          </div>

          <!-- ============================== JSON 源码 ============================== -->
          <div x-show="tab === 'json'" class="json-pane">
            <p class="muted small">
              保存与校验都以这里能解析出的 JSON 为准；切回其它标签前会先尝试把改动同步回表单，
              解析失败会留在本页并报错。
            </p>
            <textarea class="input code" rows="24" spellcheck="false"
                      x-model="rawText" @input="onJsonInput()"></textarea>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
{% endblock %}
