{% extends "base.html" %}
{% block title %}制作历史 · ComfyUI-Mie{% endblock %}

{% block content %}
<section class="panel" x-data="historyPage()">
  <div class="panel-head">
    <h2>🗂️ 制作历史</h2>
    <div class="panel-head-actions">
      <span class="muted" x-text="statusText"></span>
      <!-- 实时进度：ComfyUI 自己报的进度（镜头、采样步、当前节点） -->
      <span class="badge warn" id="render-progress" x-show="progressLine"
            x-text="progressLine" title="ComfyUI 的实时进度"></span>
      <span class="badge" id="render-progress-offline"
            x-show="!progressLine && progressOffline"
            x-text="'进度流断开（任务状态仍由下面的轮询确认）'"></span>
      <button class="btn danger" type="button" x-show="hasActiveJob"
              :disabled="interrupting" @click="interruptRender()"
              title="停掉正在跑的那一个；跑着好几个时会让你先选">⏹ 停止当前渲染</button>
      <button class="btn" type="button" @click="load()">🔄 刷新</button>
      <a class="btn" href="/video">🎞️ 去制作</a>
    </div>
  </div>

  <p class="muted">
    按<b>作品</b>看：一个运行目录是一部作品，它下面的每次生成是一次尝试。
    成片挂在作品上，展开看每一次尝试的时间和状态。移出列表不会删掉硬盘上的成片。
  </p>

  <div class="filter-bar">
    <button class="pill" :class="{ active: filter === 'all' }"
            @click="setFilter('all')">全部</button>
    <button class="pill" :class="{ active: filter === 'favorite' }"
            @click="setFilter('favorite')">★ 收藏</button>
    <button class="pill" :class="{ active: filter === 'running' }"
            @click="setFilter('running')">进行中</button>
    <button class="pill" :class="{ active: filter === 'done' }"
            @click="setFilter('done')">已完成</button>
    <button class="pill" :class="{ active: filter === 'failed' }"
            @click="setFilter('failed')">失败/中断</button>
    <!-- U06：搜索作品（运行名 / 剧本 / 标题 / 错误文本），整部作品一起命中 -->
    <input class="input history-search" x-model="searchQuery"
           @input.debounce.400ms="page = 1; load()"
           placeholder="搜作品：名字、剧本或错误文本">
  </div>

  <div class="card">
    <div class="card-head">
      <h3 x-text="'共 ' + total + ' 部作品 · ' + attemptsTotal + ' 次尝试'"></h3>
      <div class="panel-head-actions">
        <label class="field" style="margin: 0;">
          <span class="muted small">每页</span>
          <select class="input" x-model.number="perPage" @change="goTo(1)">
            <option :value="10">10</option>
            <option :value="20">20</option>
            <option :value="50">50</option>
          </select>
        </label>
      </div>
    </div>

    <p class="muted" x-show="!loading && !works.length">这里还没有作品。</p>
    <p class="muted" x-show="loading">正在读…</p>

    <!-- 一部作品（一个运行目录）一张卡；尝试在卡内展开（U06）。 -->
    <template x-for="w in works" :key="w.run_name">
      <div class="job-row work-row">
        <div class="job-head">
          <div class="cell-strong">
            <span x-text="w.title || w.run_name"></span>
            <button class="btn star" type="button"
                    :class="{ starred: w.favorite }"
                    @click="favoriteWork(w)"
                    :title="w.favorite ? '取消收藏这部作品' : '收藏这部作品'"
                    x-text="w.favorite ? '★' : '☆'"></button>
          </div>
          <div class="muted small">
            <span x-text="w.script"></span>
            <span x-text="' · ' + w.attempt_count + ' 次尝试'"></span>
            <span class="muted" x-text="'（' + (w.statuses || []).map(statusLabel).join('／') + '）'"></span>
            <span class="muted small" style="display: block; overflow-wrap: anywhere"
                  x-text="'目录：' + w.run_name"></span>
          </div>
          <div class="muted small" x-show="w.submitted_at"
               x-text="timeText(w.submitted_at)"></div>
        </div>
        <span class="badge" :class="statusClass(w.latest_status)"
              x-text="'最新：' + statusLabel(w.latest_status)"></span>
        <!-- 等决定的事不能藏在折叠里：作品卡上先亮出来。 -->
        <span class="badge warn" x-show="workHasReview(w)">待审</span>

        <!-- 正式成片挂在作品上；播放器点开才挂。 -->
        <template x-if="w.film">
          <div class="delivery">
            <template x-if="playingWork === w.run_name">
              <video class="delivery-player" controls preload="metadata"
                     :src="'/media/' + w.film"></video>
            </template>
            <div class="delivery-meta">
              <span class="cell-strong" x-text="w.film.split('/').pop()"></span>
              <span class="muted small" x-text="durationText(workManifest(w))"></span>
              <button class="btn" type="button" x-show="playingWork !== w.run_name"
                      @click="playWork(w)">▶ 播放</button>
              <a class="btn primary" :href="'/media/' + w.film"
                 download>⬇ 下载成片</a>
            </div>
          </div>
        </template>
        <p class="warn small" x-show="!w.film">还没有成片。</p>

        <!-- 声音在作品内直接试听（U06，复用统一播放器）。 -->
        <div class="sample-row" x-show="(w.audios || []).length">
          <span class="muted small">声音：</span>
          <template x-for="(url, ai) in (w.audios || [])" :key="url">
            <button class="btn subtle" type="button"
                    @click="playSample('h:' + url, '/media/' + url)"
                    :aria-label="'试听声音 ' + (ai + 1)"
                    x-text="audioPreviewState.key === 'h:' + url && audioPreviewState.playing
                      ? '⏸ ' + (ai + 1) : '▶ ' + (ai + 1)"></button>
          </template>
        </div>

        <!-- 尝试列表：多尝试默认折叠，单尝试直接摊开。 -->
        <div class="job-actions">
          <button class="btn subtle" type="button"
                  x-show="w.attempt_count > 1"
                  @click="toggleExpanded(w.run_name)"
                  x-text="isExpanded(w.run_name)
                    ? '收起尝试列表' : '展开 ' + w.attempt_count + ' 次尝试'"></button>
        </div>
        <template x-if="w.attempt_count <= 1 || isExpanded(w.run_name)">
          <div class="attempt-list">
            <template x-for="j in w.attempts" :key="j.job_id || j.run_name">
              <div class="attempt-row">
                <div class="muted small">
                  <span x-show="j.attempt" x-text="'第 ' + j.attempt + ' 版'"></span>
                  <span x-show="j.continued" x-text="' · 续跑'"></span>
                  <span x-show="j.from_disk" x-text="' · 磁盘记录'"></span>
                  <span x-show="j.submitted_at" x-text="' · ' + timeText(j.submitted_at)"></span>
                </div>
                <span class="badge" :class="statusClass(j.status)"
                      x-text="statusLabel(j.status)"></span>
                <div class="muted small" x-show="j.progress && j.progress.message"
                     x-text="progressText(j.progress)"></div>
                <div class="warn small" x-show="(j.inputs_changed || []).length"
                     x-text="'输入已变更：' + (j.inputs_changed || []).join('、')
                               + '（结果可能与提交时不同）'"></div>

                <!-- 待审的分镜：引擎的 Review Gate 停在这里等一个决定。
                     候选的预览是引擎自己的那一份，不是重新生成的。 -->
                <template x-if="j.review && j.review.shot">
                  <div class="review-panel">
                    <div class="card-head">
                      <h4 x-text="'待审分镜 · 第 ' + (j.review.shot.index || 0)
                                + ' / ' + (j.review.shot.count || 0) + ' 镜'"></h4>
                      <span class="badge" :class="j.review.actionable ? 'warn' : ''"
                            x-text="j.review.actionable ? '等人决定' : '只剩存档'"></span>
                    </div>
                    <p class="muted small"
                       x-text="'分镜 ' + (j.review.shot.id || '') + ' · 种子 '
                                 + (j.review.shot.seed || '') + ' · '
                                 + ((j.review.shot.frames || 0) / 24).toFixed(1) + ' 秒'"></p>
                    <p class="muted small" x-show="j.review.shot.prompt"
                       x-text="'提示词：' + (j.review.shot.prompt || '').slice(0, 200)"></p>
                    <p class="err small" x-show="j.review.warning"
                       x-text="j.review.warning"></p>
                    <p class="warn small" x-show="j.review.durable"
                       x-text="j.review.recovery_instructions
                                 || '这次审片只剩存档，只能人工从检查点恢复。'"></p>

                    <div class="job-artifacts">
                      <template x-for="c in (j.review.candidates || [])" :key="c.revision">
                        <div class="review-candidate">
                          <template x-if="c.url">
                            <video class="delivery-player" controls preload="metadata"
                                   :src="c.url"></video>
                          </template>
                          <span class="muted small"
                                x-text="'候选 ' + c.number + ' · 种子 ' + c.seed + ' · '
                                          + ((c.frames || 0) / 24).toFixed(1) + ' 秒'"></span>
                          <button class="btn primary" type="button"
                                  x-show="j.review.actionable"
                                  :disabled="reviewBusy"
                                  @click="decideReview(j, c, 'approve')">✅ 采纳这一镜</button>
                        </div>
                      </template>
                    </div>

                    <div class="job-actions" x-show="j.review.actionable">
                      <button class="btn" type="button" :disabled="reviewBusy"
                              @click="decideReview(j, null, 'reroll')">🎲 重掷这一镜</button>
                      <span class="muted small"
                            x-text="reviewMessage"></span>
                    </div>
                  </div>
                </template>
                <p class="warn small" x-show="j.review_error" x-text="j.review_error"></p>

                <details class="preview-block" x-show="(j.segments || []).length">
                  <summary x-text="'分镜片段（' + (j.segments || []).length + '）'"></summary>
                  <div class="job-artifacts">
                    <template x-for="a in (j.segments || [])" :key="a.relpath">
                      <a class="artifact" :href="'/media/' + a.relpath" target="_blank" rel="noopener"
                         x-text="a.name"></a>
                    </template>
                  </div>
                </details>

                <details class="preview-block" x-show="(j.audio || []).length || (j.technical || []).length">
                  <summary x-text="'声音与技术文件（' + ((j.audio || []).length + (j.technical || []).length) + '）'"></summary>
                  <div class="job-artifacts">
                    <template x-for="a in (j.audio || [])" :key="a.relpath">
                      <a class="artifact" :href="'/media/' + a.relpath" target="_blank" rel="noopener"
                         x-text="a.name"></a>
                    </template>
                    <template x-for="a in (j.technical || [])" :key="a.relpath">
                      <a class="artifact" :href="'/media/' + a.relpath" target="_blank" rel="noopener"
                         x-text="a.name"></a>
                    </template>
                  </div>
                </details>

                <div class="job-actions">
                  <button class="btn danger" type="button"
                          x-show="j.status === 'running' || j.status === 'queued'"
                          :disabled="interrupting" @click="interruptRender(j)"
                          :title="'停掉这一次：' + (j.title || j.run_name)"
                          x-text="j.status === 'queued'
                            ? '⏹ 从队列里撤掉这次'
                            : '⏹ 停掉这次渲染'"></button>
                  <button class="btn subtle" type="button"
                          x-show="canContinue(j)" @click="continueJob(j)"
                          :disabled="submitting"
                          title="用同样的角色绑定和参数，接着这次尝试继续生成">▶ 从这次继续</button>
                  <button class="btn subtle" type="button"
                          x-show="canAssemble(j)" @click="assembleJob(j)"
                          :disabled="submitting"
                          title="用这次已经保存下来的分镜拼出成片，不重新生成任何一帧">🎞️ 用已保存的分镜拼片</button>
                  <button class="btn subtle" type="button"
                          x-show="j.script" @click="remakeJob(j)"
                          title="带着这次的角色绑定和参数去制作页，生成一个新的运行">🔁 用本次配置再做一版</button>
                  <button class="btn subtle" type="button" @click="removeRecord(j)"
                          title="从列表里移出这次尝试；硬盘上的成片不动">🗑️ 移出这条</button>
                  <button class="btn danger" type="button" @click="removeFiles(j)"
                          x-show="j.run_name"
                          title="连硬盘上的文件一起删掉，无法恢复">🗑️ 连文件一起删</button>
                </div>
                <p class="err small" x-show="j.error" x-text="j.error"></p>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <div class="pager" x-show="pages > 1">
      <button class="btn" type="button" @click="goTo(page - 1)"
              :disabled="page <= 1">← 上一页</button>
      <span class="muted small"
            x-text="'第 ' + page + ' / ' + pages + ' 页（按作品分页，尝试不会被拆散）'"></span>
      <button class="btn" type="button" @click="goTo(page + 1)"
              :disabled="page >= pages">下一页 →</button>
    </div>
  </div>

  <div class="result-box" x-show="message" x-text="message"></div>
</section>
{% endblock %}
