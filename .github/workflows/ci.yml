name: CI

# The suite does not pass cleanly on any platform (Windows loses scripts to
# symlink privileges, NTFS timestamp granularity and a Node 24 harness
# change; Linux loses a different set). The gate is therefore a BASELINE
# gate - see tools/ci_gate.py. A new failure turns the build red; a known
# failure that starts passing is reported as fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out ComfyUI (the tests import its runtime)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git \
            "$RUNNER_TEMP/ComfyUI"
          echo "COMFYUI_PATH=$RUNNER_TEMP/ComfyUI" >> "$GITHUB_ENV"

      - name: Install the Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy av safetensors pillow

      - name: Check the node-type rename map is current
        shell: bash
        run: |
          # The map is generated from the registered node types. If a node
          # is added or renamed without regenerating it, this fails: a stale
          # map means a type name that is registered under one spelling and
          # looked up under another.
          python tools/gen_rename_map.py --check

      - name: Run the web front end's suite
        shell: bash
        run: |
          # The web app (webapp/) ships with this plugin, so it is tested
          # here too. Its tests never touch the real asset library: each
          # one gets a temporary plugin root.
          python -m pip install flask soundfile pytest
          python -m pip install "comfyui-mie-llm>=0.1.5" "comfyui-mie-prompt>=0.1.5" "comfyui-mie-craft>=0.1.5"
          # The browser tests drive the pages: they are the only ones
          # that can see what a person sees. Two bugs got past the API
          # tests and were caught here - a confirmation box inside the
          # card that saving hides, and a message cleared by the reload
          # that followed the save.
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m pytest webapp_tests -q

      - name: The web app starts and serves its pages
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, pathlib
          # An empty plugin root: the pages must serve even with no library.
          root = pathlib.Path(tempfile.mkdtemp()) / "plugin"
          (root / "asset_library" / "characters").mkdir(parents=True)
          os.environ["MIE_PLUGIN_ROOT"] = str(root)
          os.environ["MIE_WEB_SETTINGS"] = str(root / "settings.json")
          from webapp.flask_app import create_app
          client = create_app().test_client()
          for path in ("/", "/llm", "/assets", "/scripts", "/video"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              print("  OK", path)
          PY

      - name: Run the suite through the baseline gate
        shell: bash
        run: |
          python tools/ci_gate.py --comfy-root "$COMFYUI_PATH" --jobs 4 --timeout 240

      - name: Keep the computed baseline
        if: always()
        shell: bash
        run: |
          # The gate writes the baseline when there is none. Keep it so a
          # drift in the known failures is visible instead of silent.
          mkdir -p baseline
          label=$(python -c "import sys; sys.path.insert(0, 'tools'); import ci_gate; print(ci_gate.discover_platform())")
          cp "tools/known_failures/$label.txt" baseline/ 2>/dev/null || true

      - name: Upload the computed baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-failures-${{ matrix.os }}
          path: baseline/

  # NOT IN CI - these need the real machines:
  #   * Windows volume types (FAT / exFAT): a hosted runner has one disk.
  #   * Mapped drives (GetDriveTypeW == DRIVE_REMOTE): the character assets
  #     live on a UNC share on the LAN box.
  #   * Symlink privileges (WinError 1314): Developer Mode is off by default.
  #   * In-place overwrite keeping size and mtime: the probe that proves the
  #     cache guard's failure mode, and it needs a real filesystem.
  #   * MIE_LIVE_E2E=1: a real-render matrix against the H3 models on the
  #     60GB card - minutes per scene, not a few-minute check.
  # Those run on the local and LAN machines; see PLAN.md section 8.6.2.
