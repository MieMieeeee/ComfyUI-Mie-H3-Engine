name: Publish to Comfy Registry

# Upstream shipped this workflow with an automatic trigger: a push to main
# that touches pyproject.toml. This fork changed pyproject.toml during
# Phase 0, so that trigger would have fired on our first push.
#
# The fork does not publish to the Comfy Registry yet - the plan keeps that
# decision open (PLAN.md, Q-E): we would rather run the pack on the local
# and LAN machines first and publish when the rename (Phase 2) and the
# Windows fixes have settled. So the automatic trigger is removed and the
# workflow is manual only.
#
# When we do decide to publish:
#   1. add REGISTRY_ACCESS_TOKEN to this repository's secrets;
#   2. confirm pyproject.toml's PublisherId (it is "mie") and that the
#      node type names carry the |MieH3 suffix, so the published package
#      cannot collide with the upstream one;
#   3. the three authoring packages this one depends on
#      (comfyui-mie-llm, comfyui-mie-prompt, comfyui-mie-craft) are on
#      PyPI, so the installed pack can import them;
#   4. run this workflow by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
